<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>N.A.R.U — Voice Assistant</title>

  <!-- Futuristic font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Animated background grid -->
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="app">
    <!-- Header -->
    <header class="header">
      <h1 class="logo">
        <span class="logo-letter">N</span><span class="logo-letter">A</span><span class="logo-letter">R</span><span class="logo-letter">U</span>
      </h1>
      <p class="tagline">Neural Assistant &amp; Responsive Utility</p>
      <p class="status-line" id="statusLine">SYSTEM STANDBY</p>

      <!-- Language mode selector -->
      <div class="lang-select" id="langSelect" role="group" aria-label="Language mode">
        <button type="button" class="active" data-lang="auto">Auto</button>
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="hi">हिन्दी</button>
      </div>
    </header>

    <!-- Core orb / mic visualizer -->
    <main class="core-wrapper">
      <div class="core" id="core">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <div class="bars" id="bars">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>

        <button id="micBtn" class="mic-btn" aria-label="Activate microphone">
          <svg viewBox="0 0 24 24" class="mic-icon" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="1.6"/>
            <path d="M19 11a7 7 0 0 1-14 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M12 18v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M8.5 21h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <p class="hint" id="hint">Tap the mic and speak a command</p>
    </main>

    <!-- Conversation transcript -->
    <section class="panel">
      <div class="chat-log" id="chatLog" aria-live="polite"></div>
      <div class="controls-row">
        <label class="switch-label">
          <input type="checkbox" id="continuousToggle" />
          <span>Continuous conversation</span>
        </label>
        <button type="button" id="clearBtn" class="ghost-btn">Clear</button>
      </div>
      <div class="input-bar">
        <input
          type="text"
          id="textInput"
          placeholder="Type a message… (or use the mic)"
          autocomplete="off"
        />
        <button type="button" id="sendBtn" class="send-btn" aria-label="Send">➤</button>
      </div>
    </section>

    <!-- Command reference -->
    <footer class="commands-footer">
      <p class="commands-title">TRY SAYING</p>
      <div class="commands-list">
        <span>"What's the time"</span>
        <span>"What's the date"</span>
        <span>"Open Google"</span>
        <span>"Open YouTube"</span>
        <span>"Open GitHub"</span>
        <span>"Who are you"</span>
        <span>"Google kholo"</span>
        <span>"YouTube chalao"</span>
        <span>"Music play karo"</span>
        <span>"Aaj ka time kya hai?"</span>
      </div>
    </footer>
  </div>

  <script src="js/settings.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/music.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
